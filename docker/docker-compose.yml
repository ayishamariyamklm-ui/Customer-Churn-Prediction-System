version: "3.9"

services:
  churn-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: telco_churn_app

    ports:
      - "5000:5000"
      - "8000:8000"

    volumes:
      - ../models:/app/models
      - ../artifacts:/app/artifacts
      - ../logs:/app/logs
      - ../outputs:/app/outputs

    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1

    command: python scripts/run_app.py